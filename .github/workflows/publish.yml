name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v5.0.0

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.21

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start SurrealDB
        run: |
          docker run -d --name surrealdb -p 8000:8000 \
            surrealdb/surrealdb:v3.0.5 \
            start --user root --pass root memory
          until curl -sf http://localhost:8000/health; do sleep 1; done

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run --bun test

      - name: Integration test
        run: bun run --bun test:integration
        env:
          SURREALDB_URL: ws://localhost:8000
          SURREALDB_USER: root
          SURREALDB_PASS: root

      - name: Build
        run: bun run build

      - name: Resolve version and dist-tag
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read version from package.json"
            exit 1
          fi
          # A prerelease (1.0.0-beta.1) must not take over the "latest" tag.
          if [[ "$VERSION" == *-* ]]; then
            TAG="${VERSION#*-}"   # 1.0.0-beta.1 -> beta.1
            TAG="${TAG%%.*}"      # beta.1       -> beta
          else
            TAG="latest"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NPM_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Publishing $VERSION under dist-tag '$TAG'"

      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          RELEASE_TAG="${GITHUB_REF_NAME#v}"
          if [ "$RELEASE_TAG" != "$VERSION" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match package.json version '$VERSION'"
            exit 1
          fi

      - name: Package
        run: bun pm pack

      # Auth uses npm trusted publishing via the `id-token: write` permission
      # above; no NODE_AUTH_TOKEN is set here on purpose.
      - name: Publish
        run: npm publish "surrealdb-mastra-ai-${VERSION}.tgz" --access public --tag "$NPM_TAG"
